apiVersion: v1
kind: Secret
metadata:
  labels:
    app: ifx-docs-application-service
  name: ifx-docs-basic-auth
  namespace: {{ .Values.ifx_docs.Namespace }}
type: Opaque
stringData:
  # Consumed by ingress-nginx via the auth-secret annotation below; the key
  # must be `auth` and the value htpasswd-formatted.
  #
  # `required` is deliberate: without it an unset value would deploy this
  # publicly reachable site with no authentication at all. Failing the deploy
  # is the safer outcome. deploy.yaml injects it with:
  #   --set ifx_docs.htpasswd='<the DOCS_HTPASSWD secret>'
  # (single-quoted, because a bcrypt hash contains '$' sequences)
  auth: {{ required "ifx_docs.htpasswd must be set - refusing to publish an unauthenticated public site" .Values.ifx_docs.htpasswd | quote }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: ifx-docs-application-service
  name: ifx-docs-application-service
  namespace: {{ .Values.ifx_docs.Namespace }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ifx-docs-application-service
  template:
    metadata:
      labels:
        app: ifx-docs-application-service
      annotations:
        # Roll the pods when the nginx config changes. Without this, editing
        # the ConfigMap updates it in place and the running pods keep serving
        # the old config until something else restarts them.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      containers:
      - name: ifx-docs
        image: {{ .Values.mainRepo }}/ifx-docs:{{ .Values.mainVersion }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.ifx_docs.port }}
        # No envFrom here. The site is static and needs no runtime config;
        # referencing a non-existent vault-secrets would wedge the pod in
        # CreateContainerConfigError.
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/conf.d/default.conf
          subPath: default.conf
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.ifx_docs.port }}
          initialDelaySeconds: 10
          periodSeconds: 20
          timeoutSeconds: 3
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.ifx_docs.port }}
          initialDelaySeconds: 3
          periodSeconds: 10
          timeoutSeconds: 3
        resources:
          requests:
            cpu: "10m"
            memory: "32Mi"
          limits:
            cpu: "200m"
            memory: "128Mi"
      volumes:
      - name: nginx-config
        configMap:
          name: ifx-docs-nginx-config
      imagePullSecrets:
      - name: {{ .Values.pullSecretCredentials }}

---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: ifx-docs-application-service
  name: ifx-docs-application-service
  namespace: {{ .Values.ifx_docs.Namespace }}
spec:
  selector:
    app: ifx-docs-application-service
  ports:
  - name: http
    port: {{ .Values.ifx_docs.port }}
    protocol: TCP
    targetPort: {{ .Values.ifx_docs.port }}
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  labels:
    app: ifx-docs-application-service
  name: ifx-docs-ingress
  namespace: {{ .Values.ifx_docs.Namespace }}
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # Basic auth. The referenced Secret must live in this same namespace.
    nginx.ingress.kubernetes.io/auth-type: basic
    nginx.ingress.kubernetes.io/auth-secret: ifx-docs-basic-auth
    nginx.ingress.kubernetes.io/auth-realm: {{ .Values.ifx_docs.authRealm | quote }}
spec:
  tls:
  - hosts:
    - {{ .Values.ifx_docs.host }}
    secretName: ifx-docs-tls
  rules:
  - host: {{ .Values.ifx_docs.host }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ifx-docs-application-service
            port:
              number: {{ .Values.ifx_docs.port }}
