{{/*
  Disabled for now: this chart no longer renders/manages the Secret object.
  Reason: real values are set directly on the cluster (kubectl/helm --set),
  and letting Fleet reconcile this resource from values.yaml would reset
  them to the empty placeholders below. Re-enable once secrets are moved to
  Rancher's per-target Helm Values UI (see fleet.yaml), by removing the
  surrounding `if false` block below and uncommenting `secrets:` in values.yaml.

  IMPORTANT before pushing this change: the live `dynamics-connector-secret`
  object already exists from a prior release. Helm will delete it on the
  next sync since it's no longer part of the rendered chart, unless you
  protect it first — run this once per target cluster before syncing:
    kubectl annotate secret dynamics-connector-secret helm.sh/resource-policy=keep -n xana --overwrite
  Already-running pods keep their env vars either way; only NEW pods
  (restarts/rollouts) would fail to start if the Secret gets deleted.
*/}}
{{- if false }}
apiVersion: v1
kind: Secret
metadata:
  name: dynamics-connector-secret
  labels:
    {{- include "svc.labels" . | nindent 4 }}
type: Opaque
data:
  CRM_URL:      {{ .Values.secrets.crmUrl      | b64enc | quote }}
  CRM_USERNAME: {{ .Values.secrets.crmUsername | b64enc | quote }}
  CRM_PASSWORD: {{ .Values.secrets.crmPassword | b64enc | quote }}
{{- end }}
