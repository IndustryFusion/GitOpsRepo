{{- if .Values.networkPolicy.enabled }}
# Only the named services may reach this one. Check the cluster's CNI enforces
# NetworkPolicy before relying on this.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Chart.Name }}
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "svc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowedFrom }}
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ . }}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.ports }}
        - protocol: TCP
          port: {{ . }}
        {{- end }}
{{- end }}
