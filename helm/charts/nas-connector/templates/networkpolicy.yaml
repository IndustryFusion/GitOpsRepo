{{/*
The connector exposes no authentication of its own, so anything able to reach
its port can read every file under the configured roots. It is a ClusterIP
service with no Ingress for that reason; enable this policy to narrow ingress
to the backend pod as well.
*/}}
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nas-connector
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "svc.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ .Values.networkPolicy.backendPodSelectorLabel }}
      ports:
        - protocol: TCP
          port: 8082
{{- end }}
