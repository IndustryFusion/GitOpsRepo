{{/*
Runtime credentials for the NAS connector.

This template exists on purpose — contrast with the web-connector chart, whose
deployment references a Secret that has no template at all and therefore leaves
the pod in CreateContainerConfigError unless someone created it by hand.

Rendered only when a value is supplied, so a cluster that manages this Secret
out-of-band (kubectl/Rancher/sealed-secrets) is not fought over by Helm.
*/}}
{{- if or .Values.secrets.synoUsername .Values.secrets.synoPassword .Values.secrets.synoCaPem }}
apiVersion: v1
kind: Secret
metadata:
  name: nas-connector-secret
  labels:
    {{- include "svc.labels" . | nindent 4 }}
type: Opaque
stringData:
  SYNO_USERNAME: {{ .Values.secrets.synoUsername | quote }}
  SYNO_PASSWORD: {{ .Values.secrets.synoPassword | quote }}
  SYNO_CA_PEM:   {{ .Values.secrets.synoCaPem | quote }}
{{- end }}
