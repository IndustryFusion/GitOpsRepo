# ─────────────────────────────────────────────────────────────────────────────
# XANA frontend values.
#
# IMPORTANT: NEXT_PUBLIC_API_URL is baked into the image at BUILD time
# (Next.js limitation). You must set it before building:
#   NEXT_PUBLIC_API_URL=https://api.your-domain.com docker build \
#     --build-arg NEXT_PUBLIC_API_URL=https://api.your-domain.com \
#     -t <registry>/xana-frontend:latest xana-business/frontend
#
# config.nextPublicApiUrl below is injected as a runtime env var too (only
# affects server-side Next.js code, not already-built browser bundles).
# ─────────────────────────────────────────────────────────────────────────────

imageRegistry: "ifx40/"
image: "xana-frontend:20261105171821"
imagePullPolicy: Always

# Pull secrets for a private registry. Empty changes nothing. Set together with
# imageRegistry when moving to a private namespace, after the Secret exists in
# the target namespace, e.g.: imagePullSecrets: [{ name: regcred }]
imagePullSecrets: [{ name: regcred }]

replicas: 1

service:
  type: LoadBalancer
  # Restrict to the LAN/VPN CIDRs per target, e.g. ["10.0.0.0/8"]. Empty allows any source.
  loadBalancerSourceRanges: []
  port: 3000

resources:
  requests: { cpu: "50m",  memory: "128Mi" }
  limits:   { cpu: "250m", memory: "256Mi" }

config:
  nextPublicApiUrl: "http://localhost:4000"
