# ─────────────────────────────────────────────────────────────────────────────
# XANA workflow-agent values.
#
# Deploy into the SAME namespace as mongo/qdrant/backend — depends on
# their fixed Service DNS names unless overridden below.
# ─────────────────────────────────────────────────────────────────────────────

imageRegistry: "ibn40/"
image: "xana-workflow-agent:20260814092300"
imagePullPolicy: Always

replicas: 1

service:
  type: ClusterIP
  port: 8000

# Holds the parse cache, rendered page images, BM25 indexes and the LangGraph
# checkpoint db (/app/data). Page images are the growth driver — one PNG per
# diagram page — and the long-path fix means documents that previously failed to
# write their images now succeed, so a full re-ingest stores more than before.
# Qdrant vectors are NOT here; they live in the qdrant chart's own volume.
#
# Growing this on an EXISTING claim only works if the storage class sets
# allowVolumeExpansion: true. k3s's default local-path provisioner does not, and
# also does not enforce the size at all — there the number is nominal and the pod
# can already use the node's disk. Check before expecting this to do anything:
#   kubectl get sc
#   kubectl get pvc workflow-agent-data -o jsonpath='{.spec.resources.requests.storage}'
storage:
  size: "20Gi"
  storageClass: ""

# Deliberately Burstable, not Guaranteed. Indexing is spiky and memory-hungry —
# PDF page rendering and OCR, embedding batches, and the BM25 index that
# sparse_index.get_or_build_bm25_index holds in process for the whole scoped
# corpus — so the gap between request and limit is headroom this workload
# actually uses. Equalising them to buy a better QoS class would trade an 8Gi
# ceiling for a hard OOMKill at the request size.
resources:
  requests: { cpu: "500m", memory: "2Gi" }
  limits:   { cpu: "2000m", memory: "8Gi" }

config:
  # In-cluster service DNS names — override if these live outside this
  # cluster/namespace.
  mongodbUri: "mongodb://mongo:27017/xana-business"
  qdrantUrl:  "http://qdrant:6333"
  xanaApiBaseUrl: "http://backend:4000"

  # ---- LLM / AI ----
  openaiCompatibleModel: "mistralai/Mistral-Small-24B-Instruct"
  embeddingModel:      "BAAI/bge-m3"
  embeddingVectorSize: "1024"
  embeddingBatchSize:  "32"
  ocrModel:             "lightonai/LightOnOCR-2-1B"
  ocrEnabled:           "true"
  ocrFallbackTesseract: "true"

  # ---- Retrieval / reranking ----
  retrievalCandidatePool: "50"
  retrievalTopKAnalysis:  "10"
  retrievalTopKContinue:  "12"
  retrievalPassageChars:  "900"
  retrievalRerankPool:    "40"
  retrievalMinScore:      "0.35"
  rerankEnabled:          "true"
  crossEncoderEnabled:    "true"
  crossEncoderModel:      "cross-encoder/ms-marco-MiniLM-L-6-v2"
  mmrLambda:              "0.7"
  queryExpansionEnabled:      "true"
  queryExpansionMaxVariants:  "3"
  knowledgeMaxScopeItems: "3000"
  knowledgeMaxLeaves:     "3000"
  knowledgeGlobalAlwaysSearch: "true"
  knowledgeScopeBoost:         "1.5"

  # ---- Web search (Tavily) ----
  webSearchEnabled:               "true"
  webSearchMaxResults:            "10"
  webSearchMaxPages:              "4"
  webSearchTriggerMinManualScore: "0.5"
  webSearchMinResultScore:        "0.2"
  webSearchDepth:                 "basic"
  webSearchPassageChars:          "900"
  webSearchTimeoutSec:            "25.0"
  webSearchDomainAllowlist:       ""

  logLevel: "info"

  # ---- Vision-captioning backend — see the ovms chart ----
  # Pointed at OVMS (OpenAI-compatible, /v3/chat/completions) rather than
  # Ollama — same code path either way (vision_caption.py), only these
  # three values differ. Requires the ovms chart's pod to be Ready
  # (GET /v2/health/ready) — its startupProbe allows up to ~60min for the
  # first-boot model download before it answers. To revert to Ollama, set:
  #   ollamaBaseUrl:                    "http://ollama:11434"
  #   ollamaVlModel:                    "qwen3-vl:2b-instruct"
  #   visionCaptionChatCompletionsPath: "/v1/chat/completions"
  ollamaBaseUrl: "http://ovms:8000"
  ollamaVlModel: "OpenVINO/Qwen3.5-4B-int4-ov"
  visionCaptionChatCompletionsPath: "/v3/chat/completions"
  # Leave "false" until the ovms chart is deployed and reachable — this
  # only gates ingestion-time diagram captioning, never the live chat path.
  visionCaptionEnabled: "true"
  visionCaptionTimeoutSeconds:  "640"
  visionCaptionMaxConcurrency:  "4"
  visionCaptionMaxImageSize:    "2000"
  visionCaptionPromptVersion:   "v1"
  visionCaptionMaxOutputTokens: "768"

  # ---- Langfuse tracing ----
  langfuseHost: "http://localhost:3001"

# ── Sensitive values — override via --set, a separate values file, or
# Rancher's per-target Helm Values UI. NEVER commit real credentials. ────────
# Commented out for now: the Secret resource itself is disabled in
# templates/secret.yaml (real values are managed directly on the cluster).
# Uncomment both together to re-enable Helm-managed secrets.
# secrets:
#   openaiCompatibleBaseUrl: ""   # e.g. https://api.openai.com/v1 — required
#   openaiCompatibleApiKey:  ""   # required
#   # Only needed if qdrant's chart was deployed with secrets.apiKey set.
#   qdrantApiKey: ""
#   # Only needed if config.webSearchEnabled = true.
#   tavilyApiKey: ""
#   # Only needed if your Ollama server requires an API key (self-hosted
#   # ollama chart doesn't, by default).
#   ollamaApiKey: ""
#   langfusePublicKey: ""  # ⚠️ sensitive — set manually
#   langfuseSecretKey: ""  # ⚠️ sensitive — set manually
