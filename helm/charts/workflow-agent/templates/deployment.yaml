apiVersion: apps/v1
kind: Deployment
metadata:
  name: workflow-agent
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas | default 1 }}
  selector:
    matchLabels:
      {{- include "svc.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        {{- include "svc.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: workflow-agent
          image: {{ include "svc.image" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: workflow-agent-config
            - secretRef:
                name: workflow-agent-secret
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          # Liveness asks "is this process wedged?", so it must not depend on
          # anything external. /health probes the embedding API and Qdrant;
          # pointing liveness at it made indexing kill its own pod — ingest
          # saturates that same embedding provider, the check times out, and the
          # kubelet restarts the pod mid-run to "fix" a slow upstream that a
          # restart cannot fix. /livez does no I/O.
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
          volumeMounts:
            - name: agent-data
              mountPath: /app/data
      volumes:
        - name: agent-data
          persistentVolumeClaim:
            claimName: workflow-agent-data
---
apiVersion: v1
kind: Service
metadata:
  name: workflow-agent
  labels:
    {{- include "svc.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "svc.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8000
