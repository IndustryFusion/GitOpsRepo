{{- if .Values.seedConnectors.enabled }}
# Runs once after install to register the connectors in MongoDB.
# Requires the web-connector and dynamics-connector charts to also be deployed.
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-connectors
  labels:
    {{- include "svc.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: 5
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "svc.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: seed-connectors
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: {{ include "svc.image" . }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["node", "scripts/seed-connectors-docker.mjs"]
          envFrom:
            - configMapRef:
                name: backend-config
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
{{- end }}
