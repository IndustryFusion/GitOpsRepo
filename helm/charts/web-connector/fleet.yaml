# Rancher Fleet bundle definition for the web-connector chart.
defaultNamespace: xana

helm:
  chart: "."
  force: false
  timeoutSeconds: 300

# Per-cluster/target overrides. WIKI_USERNAME/WIKI_PASSWORD are baked into the
# image at build time (docker build --build-arg), not supplied as Helm secrets
# — there's nothing for this chart to inject at deploy time for this connector.
#
# targetCustomizations:
#   - name: production
#     clusterSelector:
#       matchLabels:
#         env: production
#     helm:
#       values: {}
