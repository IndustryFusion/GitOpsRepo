imageRegistry: "ibn40/"
image: "xana-web-connector:20260806135501"
imagePullPolicy: Always

replicas: 1

service:
  type: ClusterIP
  port: 8080

resources:
  requests: { cpu: "50m",  memory: "128Mi" }
  limits:   { cpu: "250m", memory: "256Mi" }

config:
  port:                "8080"
  # Set to "true" only for internal/dev targets.
  allowHttp:           "true"
  allowPrivateNetwork:  "true"
  allowInlineSecrets:   "true"
  bodyLimit:            "1mb"
  rateLimitWindowMs:    "60000"
  rateLimitMax:         "6000"

# Web connector wiki credentials: baked into the image at build time via
# `docker build --build-arg WIKI_USERNAME=... --build-arg WIKI_PASSWORD=...`
# (see connectors/storages/web/Dockerfile), not injected by Kubernetes. The
# {{WIKI_USERNAME}} / {{WIKI_PASSWORD}} placeholders below are still
# substituted from process.env at runtime — that env var just now comes from
# the image's baked-in ENV instructions instead of a Secret.

# Starter connector config. Replace baseUrl/allowedHosts/loginUrl with your
# real wiki, or add more keys — each becomes a file under /data/connectors.
connectorConfig:
  example.json: |
    {
      "name": "Microstep Europa Wiki",
      "baseUrl": "https://wiki.microstep-europa.de",
      "allowedHosts": ["wiki.microstep-europa.de"],
      "auth": {
        "type": "form",
        "loginUrl": "https://wiki.microstep-europa.de/Account/Login?returnurl=%2F",
        "method": "POST",
        "contentType": "application/x-www-form-urlencoded",
        "credentialPlacement": "body",
        "fields": {
          "Login.UserName": "{{WIKI_USERNAME}}",
          "Login.Password": "{{WIKI_PASSWORD}}"
        },
        "successDetection": {
          "type": "notContainsHtml",
          "selectorOrText": "login"
        },
        "session": {
          "type": "cookie",
          "expiresInSeconds": 3600,
          "expiredDetection": {
            "statusCodes": [401, 403],
            "containsHtml": "login"
          }
        }
      },
      "roots": [
        {
          "name": "Root",
          "url": "https://wiki.microstep-europa.de/"
        }
      ],
      "parsing": {
        "itemSelector": "a[href]",
        "nameSelector": null,
        "hrefAttribute": "href",
        "folderRules": [
          { "type": "cssClassContains", "value": "menuItem" }
        ],
        "fileRules": [
          { "type": "extension", "values": [".pdf", ".doc", ".docx", ".txt", ".xlsx", ".pptx", ".zip", ".png", ".jpg", ".jpeg", ".webp", ".gif", ".bmp"] },
          { "type": "urlContains", "value": "/gall/" }
        ],
        "ignoreRules": [
          { "type": "urlContains", "value": "logout" },
          { "type": "urlStartsWith", "value": "mailto:" },
          { "type": "urlStartsWith", "value": "javascript:" }
        ],
        "metadataSelectors": {
          "title": "title",
          "lastModified": ".modified-date",
          "size": ".file-size"
        },
        "pagination": {
          "enabled": false,
          "nextSelector": "a.next",
          "hrefAttribute": "href"
        }
      },
      "fileTypeDetection": {
        "extensionContentTypes": {
          "pdf": "application/pdf",
          "docx": "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
          "xlsx": "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
          "pptx": "application/vnd.openxmlformats-officedocument.presentationml.presentation",
          "zip": "application/zip"
        },
        "defaultType": "unknown"
      },
      "limits": {
        "maxDepth": 3,
        "maxPages": 100,
        "maxFileSizeMb": 100,
        "requestTimeoutMs": 30000,
        "maxConcurrentRequests": 4
      }
    }

