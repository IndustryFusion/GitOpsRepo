# Runner cleanup — removes leftovers that block checkouts on private-2.
# Container jobs run as root and see the runner's work folder at /__w. A folder in a repository's workspace that the
# runner user cannot delete (other owner, or no write permission) makes the next normal checkout there fail with
# "EACCES: permission denied" (IfricPlatform Nightly, from 13 Nov 2026).
# Start it by hand (Actions → Runner cleanup → Run workflow); no login to the runner is needed.
# MODE=check only reports owners and permissions; MODE=clean also removes the folders named below when the runner
# user could not delete them. The runner user is the owner of the repository's workspace folder.

name: Runner cleanup

on:
  workflow_dispatch:
    inputs:
      REPOSITORY:
        description: 'Repository whose workspace on private-2 to clean, e.g. IfricPlatform'
        required: true
        default: IfricPlatform
        type: string
      MODE:
        description: 'check = report only, clean = report and remove'
        required: true
        default: clean
        type: choice
        options: [check, clean]
      CLUSTER:
        description: 'Tag of the deployer image (any tag present on the runner)'
        required: false
        default: IFF-DEV-DPP-IFRIC
        type: string

permissions:
  contents: read

jobs:
  clean:
    runs-on: 'private-2'
    container:
      image: ibn40/deployer:${{ inputs.CLUSTER }}
      options: --user root
    steps:
      - name: ${{ inputs.MODE }} ${{ inputs.REPOSITORY }}'s workspace
        env:
          REPO: ${{ inputs.REPOSITORY }}
          MODE: ${{ inputs.MODE }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPO" =~ ^[A-Za-z0-9._-]+$ ]] || { echo "::error::bad repository name"; exit 1; }
          work=$(dirname "$(dirname "$GITHUB_WORKSPACE")")   # the runner's _work folder, /__w
          ws="$work/$REPO/$REPO"
          [ -d "$ws" ] || { echo "No workspace $ws on this runner: nothing to do."; exit 0; }
          me=$(stat -c %u "$ws")   # the runner user (owner of the workspace)
          echo "Container user: $(id)"
          echo "Workspace $ws: owner uid $me, $(stat -c 'gid %g, mode %a' "$ws")"
          found=0
          for name in GitOpsRepo preview-gitops; do
            d="$ws/$name"
            [ -e "$d" ] || continue
            echo "--- $REPO/$name"
            # BusyBox find (deployer image) has no -uid/-printf: list owner, mode and type with stat instead
            find "$d" | while IFS= read -r f; do stat -c '%u %a %F' "$f"; done >"$RUNNER_TEMP/owners.txt"
            stat -c '%U(%u):%G(%g) %a %n' "$d"
            foreign=$(awk -v me="$me" '$1 != me' "$RUNNER_TEMP/owners.txt" | wc -l)
            # a folder whose owner has no write permission (owner digit of the mode without bit 2)
            locked=$(awk '$3 == "directory" { o = substr($2, length($2) - 2, 1); if (int(o / 2) % 2 == 0) n++ } END { print n + 0 }' "$RUNNER_TEMP/owners.txt")
            echo "entries: $(wc -l <"$RUNNER_TEMP/owners.txt"); not owned by uid $me: $foreign; folders without owner write permission: $locked"
            echo "owners (uid: count): $(awk '{ c[$1]++ } END { for (u in c) printf "%s: %d  ", u, c[u] }' "$RUNNER_TEMP/owners.txt")"
            if [ "$foreign" -eq 0 ] && [ "$locked" -eq 0 ]; then
              echo "The runner user can delete it: kept."
              continue
            fi
            found=1
            if [ "$MODE" = clean ]; then
              rm -rf "$d"
              if [ -e "$d" ]; then echo "::error::could not remove $d"; exit 1; fi
              echo "Removed $REPO/$name"
            fi
          done
          [ "$found" = 1 ] || echo "Nothing in $REPO's workspace blocks a checkout."
